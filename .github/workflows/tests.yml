name: Tests Windows

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: _bibliotheque_mtg/src/python
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: _bibliotheque_mtg/src/python/requirements_bibliotheque.txt
      - run: python -m pip install -r requirements_bibliotheque.txt "pytest>=9,<10"
      - run: python -m pip check
      - run: python -m pytest -q
